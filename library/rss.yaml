        max_items: 25

      - name: arXiv cs.OS (Operating Systems)
        url: https://rss.arxiv.org/rss/cs.OS
        description: New cs.OS submissions, published each weekday.
        labels: [Research, Papers, Infra]
        max_items: 25

      - name: arXiv cs.PF (Performance)
        url: https://rss.arxiv.org/rss/cs.PF
