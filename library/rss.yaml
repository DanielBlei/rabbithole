        labels: [Releases, AI, Inference]

      - name: Go releases
        url: https://github.com/golang/go/tags.atom
        description: New Go version tags, including release candidates.
        labels: [Releases, Go]

      - name: KubeVirt releases
        url: https://github.com/kubevirt/kubevirt/releases.atom
