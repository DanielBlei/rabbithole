# The Rabbit Hole source library: RSS and Atom feeds.
# Format and how to add an entry: library/README.md
schema_version: 1
type: rss
description: Feeds the RSS ingestor reads, grouped for the welcome checklist.
groups:
  - name: blogs
    title: Blogs
    description: Project and engineering blogs from the AI and cloud-native stack.
    sources:
      - name: Kubernetes blog
        url: https://kubernetes.io/feed.xml
        description: Release news, SIG updates and deep dives from the Kubernetes project.
        labels: [Kubernetes, Infra, Open Source]

      - name: CNCF blog
        url: https://www.cncf.io/feed/
        description: Project news, case studies and community updates from the Cloud Native Computing Foundation.
        labels: [Kubernetes, Infra, Open Source]

      - name: Red Hat Emerging Tech
        url: https://next.redhat.com/feed/
        description: Research and early-stage projects from Red Hat's Office of the CTO.
        labels: [Open Source, Infra]

      - name: Red Hat blog
        url: https://www.redhat.com/en/rss/blog
        description: Product, open source and industry posts from Red Hat.
        labels: [Open Source, Infra]

      - name: Go blog
        url: https://go.dev/blog/feed.atom
        description: Release notes and design posts from the Go team.
        labels: [Go, Open Source]

      - name: Hugging Face blog
        url: https://huggingface.co/blog/feed.xml
        description: Model releases, libraries and tutorials from Hugging Face.
        labels: [AI, Open Source]

      - name: PyTorch blog
        url: https://pytorch.org/feed/
        description: Release and ecosystem news from the PyTorch project.
        labels: [AI, Open Source]

      - name: vLLM blog
        url: https://vllm.ai/blog/rss.xml
        description: Features, performance work and releases from the vLLM inference engine.
        labels: [AI, Inference, Open Source]

      - name: Ollama blog
        url: https://ollama.com/blog/rss.xml
        description: Feature and model announcements from Ollama.
        labels: [AI, Inference, Open Source]

      - name: llm-d blog
        url: https://llm-d.ai/blog/rss.xml
        description: Distributed LLM inference on Kubernetes from the llm-d project.
        labels: [AI, Inference, Kubernetes]

      - name: KubeVirt blog
        url: https://kubevirt.io/feed.xml
        description: "Virtual machines on Kubernetes: releases and how-tos from KubeVirt."
        labels: [Kubernetes, Infra, Open Source]

      - name: Cloudflare blog
        url: https://blog.cloudflare.com/rss/
        description: Networking, security and systems engineering write-ups from Cloudflare.
        labels: [Infra, Security]

      - name: GitHub blog
        url: https://github.blog/feed/
        description: Product, engineering and open source news from GitHub.
        labels: [Open Source, Developer Tools]

      - name: OpenAI news
        url: https://openai.com/news/rss.xml
        description: Research, model and product announcements from OpenAI.
        labels: [AI, Research]

      - name: Google Research blog
        url: https://research.google/blog/rss/
        description: Research highlights across ML, systems and science from Google.
        labels: [AI, Research]

      - name: Simon Willison
        url: https://simonwillison.net/atom/everything/
        description: Daily notes on LLMs, tools and the open web.
        labels: [AI, Developer Tools]

      - name: Lil'Log
        url: https://lilianweng.github.io/index.xml
        description: Lilian Weng's long-form surveys of ML research topics.
        labels: [AI, Research]

      - name: Ahead of AI
        url: https://magazine.sebastianraschka.com/feed
        description: Sebastian Raschka's LLM research digests and from-scratch explainers.
        labels: [AI, Research]

      - name: LWN.net
        url: https://lwn.net/headlines/rss
        description: Linux kernel and free software news.
        labels: [Linux, Open Source]

  - name: releases
