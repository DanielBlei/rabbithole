        labels: [Releases, Kubernetes]

  - name: community
    title: Community
    description: Link aggregators filtered for signal.
    sources:
      - name: Hacker News front page
        url: https://hnrss.org/frontpage?points=100
        description: Front-page Hacker News stories with 100+ points.
        labels: [Community]

      - name: Hacker News best
        url: https://hnrss.org/best
        description: The highest-voted recent Hacker News stories.
        labels: [Community]

      - name: Show HN
        url: https://hnrss.org/show?points=50
        description: Show HN launches with 50+ points.
        labels: [Community, Developer Tools]

      - name: Lobsters
        url: https://lobste.rs/rss
        description: "Lobsters front page: computing links with tagged, moderated discussion."
        labels: [Community]

      - name: "Lobsters: AI"
        url: https://lobste.rs/t/ai.rss
        description: Lobsters stories tagged ai.
        labels: [Community, AI]

      - name: "Lobsters: Go"
        url: https://lobste.rs/t/go.rss
        description: Lobsters stories tagged go.
        labels: [Community, Go]

      - name: "Lobsters: distributed"
        url: https://lobste.rs/t/distributed.rss
        description: Lobsters stories on distributed systems.
        labels: [Community, Distributed Systems]

      - name: "Lobsters: databases"
        url: https://lobste.rs/t/databases.rss
        description: Lobsters stories on databases.
        labels: [Community, Databases]

      - name: "Lobsters: devops"
        url: https://lobste.rs/t/devops.rss
        description: Lobsters stories on operations and infrastructure.
        labels: [Community, Infra]

      - name: "Lobsters: programming"
        url: https://lobste.rs/t/programming.rss
        description: Lobsters stories tagged programming.
        labels: [Community]

  - name: arxiv-categories
    title: arXiv categories
    description: Every new arXiv paper in a category. High volume, so each is capped per run.
    sources:
      - name: arXiv cs.LG (Machine Learning)
        url: https://rss.arxiv.org/rss/cs.LG
        description: New cs.LG submissions, published each weekday.
        labels: [Research, Papers, AI]
        max_items: 25  # weekday firehose

      - name: arXiv cs.AI (Artificial Intelligence)
        url: https://rss.arxiv.org/rss/cs.AI
        description: New cs.AI submissions, published each weekday.
        labels: [Research, Papers, AI]
        max_items: 25

      - name: arXiv cs.CL (Computation and Language)
        url: https://rss.arxiv.org/rss/cs.CL
        description: New cs.CL submissions, published each weekday.
        labels: [Research, Papers, AI]
        max_items: 25

      - name: arXiv stat.ML (Statistical Machine Learning)
        url: https://rss.arxiv.org/rss/stat.ML
        description: New stat.ML submissions, published each weekday.
        labels: [Research, Papers, AI]
        max_items: 25

      - name: arXiv cs.IR (Information Retrieval)
        url: https://rss.arxiv.org/rss/cs.IR
        description: New cs.IR submissions, published each weekday.
        labels: [Research, Papers, AI]
        max_items: 25

      - name: arXiv cs.MA (Multiagent Systems)
        url: https://rss.arxiv.org/rss/cs.MA
        description: New cs.MA submissions, published each weekday.
        labels: [Research, Papers, Agents]
        max_items: 25

      - name: arXiv cs.SE (Software Engineering)
        url: https://rss.arxiv.org/rss/cs.SE
        description: New cs.SE submissions, published each weekday.
        labels: [Research, Papers, Software Engineering]
        max_items: 25

      - name: arXiv cs.DC (Distributed Computing)
        url: https://rss.arxiv.org/rss/cs.DC
        description: New cs.DC submissions, published each weekday.
        labels: [Research, Papers, Distributed Systems]
        max_items: 25

      - name: arXiv cs.DB (Databases)
        url: https://rss.arxiv.org/rss/cs.DB
        description: New cs.DB submissions, published each weekday.
        labels: [Research, Papers, Databases]
        max_items: 25

      - name: arXiv cs.OS (Operating Systems)
        url: https://rss.arxiv.org/rss/cs.OS
        description: New cs.OS submissions, published each weekday.
        labels: [Research, Papers, Infra]
        max_items: 25

      - name: arXiv cs.PF (Performance)
        url: https://rss.arxiv.org/rss/cs.PF
        description: New cs.PF submissions, published each weekday.
        labels: [Research, Papers, Infra]
        max_items: 25

      - name: arXiv cs.CR (Cryptography and Security)
