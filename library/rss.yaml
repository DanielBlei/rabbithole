        labels: [Releases, AI, Inference]

      - name: Podman releases
        url: https://github.com/podman-container-tools/podman/releases.atom
        description: New Podman releases and their notes.
        labels: [Releases, Infra]

      - name: Helm releases
        url: https://github.com/helm/helm/releases.atom
        description: New Helm releases and their notes.
        labels: [Releases, Kubernetes]

      - name: Prometheus releases
        url: https://github.com/prometheus/prometheus/releases.atom
        description: New Prometheus releases and their notes.
        labels: [Releases, Infra]

      - name: kind releases
        url: https://github.com/kubernetes-sigs/kind/releases.atom
        description: New kind releases and their notes.
        labels: [Releases, Kubernetes]

      - name: llm-d releases
        url: https://github.com/llm-d/llm-d/releases.atom
        description: New llm-d releases and their notes.
        labels: [Releases, AI, Inference]

      - name: SGLang releases
        url: https://github.com/sgl-project/sglang/releases.atom
        description: New SGLang releases and their notes.
        labels: [Releases, AI, Inference]

      - name: Istio releases
