name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; let main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test with the race detector
        run: make test-race

      # Coverage is platform-independent for this gate; run it once rather
      # than producing duplicate Linux/macOS artifacts.
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: go test -coverprofile=coverage.out ./...

      - name: Print total coverage
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out | tail -1

      # Keep the profile even when the threshold step below fails so a failed
      # run can be inspected without reproducing it locally.
      - name: Upload coverage profile
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      - name: Enforce 75% coverage threshold
        if: runner.os == 'Linux'
        shell: bash
        env:
          LC_ALL: C
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub(/%/, "", $3); print $3}')
          awk -v total="$total" 'BEGIN {
            if (total + 0 < 75) {
              printf "coverage %.1f%% is below 75%%\n", total
              exit 1
            }
            printf "coverage %.1f%% meets the 75%% threshold\n", total
          }'

      # The reports are only correct when rendered. Nothing else here runs the
      # renderers end to end, and the heuristic scorer needs no backend.
      - name: Render the eval reports
        run: make eval-smoke

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # = make lint. Covers gofmt/goimports/golines and vet, per .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
