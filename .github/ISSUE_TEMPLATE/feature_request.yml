name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two things are out of scope: multi-user support (one person, one profile) and a
        hosted service (self-hosting is the deployment model).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: Roughly how it would work.
    validations:
      required: false
