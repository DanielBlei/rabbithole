name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran. Please redact `inference.api_key` and any database password.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: scorer
    attributes:
      label: Scorer
      description: If it also reproduces with `heuristic`, no model is involved.
      options:
        - heuristic (no model)
        - ollama
        - vllm
        - not sure
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - sqlite (store.db_path)
        - postgres (store.url)
        - not sure

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, and `rabbithole --version` (or the commit, if built from source).
    validations:
      required: true
