{{define "content"}}
<div class="stats-row">
  <div class="tile"><div class="num">{{.Stats.UnreadToday}}</div><div class="label">unread today</div></div>
  <div class="tile"><div class="num">{{printf "%.1f" .Stats.AvgScore}}</div><div class="label">avg score</div></div>
  <div class="tile"><div class="num">{{.Stats.SourcesActive}}</div><div class="label">sources active</div></div>
  <div class="tile placeholder"><div class="num">&gt;</div><div class="label">awaiting more widgets<span class="blink">_</span></div></div>
</div>

{{template "pane" .}}
{{end}}

{{define "scripts"}}
<script>
(function(){
  // Mockup-era client-side pagination, kept only so this page is interactive
  // to evaluate. Replaced by real server-side after/before/limit paging +
  // htmx once backend work starts — see .claude/frontend-goals.md.
  var PAGE_SIZE = 10;
  var rows = Array.prototype.slice.call(document.querySelectorAll('.pane__body .row'));
  var total = rows.length;
  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  var page = 1;

  var btnFirst = document.getElementById('btnFirst');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var pageInfo = document.getElementById('pageInfo');
  var pane = document.getElementById('pane');

  function render(){
    var start = (page - 1) * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, total);
    rows.forEach(function(row, i){
      row.style.display = (i >= start && i < end) ? '' : 'none';
    });
    pageInfo.textContent = 'items ' + (start + 1) + '–' + end + ' of ' + total;
    btnFirst.disabled = page === 1;
    btnPrev.disabled = page === 1;
    btnNext.disabled = page === totalPages;
  }

  function goTo(target){
    page = Math.min(Math.max(1, target), totalPages);
    render();
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    pane.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  }

  btnFirst.addEventListener('click', function(){ goTo(1); });
  btnPrev.addEventListener('click', function(){ goTo(page - 1); });
  btnNext.addEventListener('click', function(){ goTo(page + 1); });

  render();
})();

(function(){
  // why/note switcher: clicking the already-open tab collapses the shared box.
  // The panels are shown via CSS :checked; radios can't uncheck themselves, so
  // this only handles the collapse-on-re-click case.
  document.querySelectorAll('.toggles').forEach(function(group){
    group.querySelectorAll('.tg-tab').forEach(function(tab){
      var input = document.getElementById(tab.getAttribute('for'));
      if (!input) return;
      // capture the radio's state before the click toggles it
      tab.addEventListener('mousedown', function(){ tab._open = input.checked; });
      tab.addEventListener('click', function(e){
        if (tab._open){ e.preventDefault(); input.checked = false; }
      });
    });
  });

  // Note edit -> apply. Real persistence is the note mutation route: apply will
  // hx-post to it and swap in the server-rendered row fragment (already in view
  // mode). Until that backend lands this updates the view optimistically so the
  // flow is demoable; cancel restores the last saved text.
  document.querySelectorAll('.tg-panel-note').forEach(function(panel){
    var toggle  = panel.querySelector('.note-toggle');
    var input   = panel.querySelector('.note-input');
    var viewP   = panel.querySelector('.note-view p');
    var editBtn = panel.querySelector('.note-edit-btn');
    var apply   = panel.querySelector('.note-apply');
    var cancel  = panel.querySelector('.note-cancel');
    if (!toggle || !input || !apply) return;

    var saved = panel.classList.contains('empty') ? '' : viewP.textContent;

    apply.addEventListener('click', function(){
      // TODO(backend): hx-post to the note route instead of mutating here.
      saved = input.value.trim();
      if (saved){ viewP.textContent = saved; panel.classList.remove('empty'); editBtn.textContent = 'edit'; }
      else      { viewP.textContent = 'No note yet.'; panel.classList.add('empty'); editBtn.textContent = '+ add'; }
      toggle.checked = false; // flip back to view mode
    });

    if (cancel) cancel.addEventListener('click', function(){ input.value = saved; });
  });
})();
</script>
{{end}}
