{{define "content"}}
<div class="stats-row">
  <div class="tile"><div class="num">{{.Stats.Available}}</div><div class="label">total</div></div>
  <div class="tile"><div class="num num--high" id="statHigh" data-high="{{.Stats.HighThreshold}}">{{.Stats.HighSignal}}</div><div class="label">high signal &ge;{{.Stats.HighThreshold}}</div></div>
  <div class="tile"><div class="num" id="statAvg">{{printf "%.1f" .Stats.AvgScore}}</div><div class="label">avg score</div></div>
  <div class="tile placeholder"><div class="num">&gt;</div><div class="label">more widgets soon<span class="blink">_</span></div></div>
</div>

{{template "pane" .}}
{{end}}

{{define "scripts"}}
<script src="/static/js/feed.js" defer></script>
{{end}}
