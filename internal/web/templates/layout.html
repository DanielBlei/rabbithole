{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{.Title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <span class="wordmark"><b>The Rabbit Hole</b></span>
      <span class="breaker">/</span>
      <nav class="topbar__nav">
        <a class="{{if eq .Active "feed"}}active{{end}}" href="/feed">Feed</a>
      </nav>
    </div>
    <div class="topbar__right">
      <div class="clock" id="clock" aria-label="Current date and time">
        <span class="clock__time"></span>
        <span class="clock__date"></span>
      </div>
      <button class="settings-btn" id="settingsToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
        <span class="gear" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </span>
      </button>
      <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-sub">
          <a class="settings-panel__item settings-sub__trigger" href="#" role="button" tabindex="0">
            Date &amp; time <span class="settings-sub__caret">&#8249;</span>
          </a>
          <div class="settings-sub__flyout">
            <div class="settings-panel__label">Time</div>
            <div class="clk-row">
              <button type="button" class="clk-btn" data-clk-toggle="time24">24-hour</button>
              <button type="button" class="clk-btn" data-clk-toggle="seconds">Show seconds</button>
            </div>
            <div class="settings-panel__label">Date</div>
            <div class="clk-slider">
              <div class="clk-slider__preview" data-clk-preview></div>
              <input type="range" min="0" max="5" step="1" value="2" data-clk-range="dateFmt" aria-label="Date format">
            </div>
          </div>
        </div>
        <div class="settings-panel__divider"></div>
        <a class="settings-panel__item" href="#" hx-get="/config" hx-target="#modal" hx-swap="innerHTML">View config</a>
      </div>
    </div>
  </header>
  <div class="content">
    {{block "content" .}}{{end}}
  </div>
  <div id="modal"></div>
  <script>
  (function(){
    var btn = document.getElementById('settingsToggle');
    var panel = document.getElementById('settingsPanel');

    function close(){
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }
    function open(){
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
    }

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      if (panel.hidden) { open(); } else { close(); }
    });
    document.addEventListener('click', function(e){
      if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) close();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') close();
    });
  })();

  // Config viewer modal: htmx swaps the fragment into #modal; this clears it on
  // backdrop click, the close button, or Escape. The "View config" link also
  // closes the settings dropdown so the modal isn't left under it.
  (function(){
    var modal = document.getElementById('modal');
    function dismiss(){ modal.innerHTML = ''; }
    modal.addEventListener('click', function(e){
      if (e.target.closest('[data-modal-close]')) dismiss();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && modal.firstElementChild) dismiss();
    });
  })();

  // Topbar clock: a live local-time + date readout, formatted entirely client-
  // side and ticked every second. Format prefs (24h, seconds, date style) live
  // in localStorage and are edited from the settings panel — pure presentation,
  // so no server round-trip and nothing touches the store or config.
  (function(){
    var clock = document.getElementById('clock');
    if (!clock) return;
    var timeEl = clock.querySelector('.clock__time');
    var dateEl = clock.querySelector('.clock__date');

    var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MO = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    function pad(n){ return n < 10 ? '0'+n : ''+n; }
    function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); }

    function get(k, def){
      var v = localStorage.getItem('clock.'+k);
      if (v === null) return def;
      return typeof def === 'boolean' ? v === '1' : v;
    }
    function set(k, val){
      localStorage.setItem('clock.'+k, typeof val === 'boolean' ? (val?'1':'0') : val);
    }

    var prefs = {
      time24:  get('time24', true),
      seconds: get('seconds', false),
      dateFmt: get('dateFmt', 'medium')
    };
    // Date formats ordered compact→verbose so the slider reads left-to-right.
    var FMTS = ['numeric','short','medium','long','ordinal','hidden'];

    function fmtTime(d){
      var h = d.getHours(), ap = '';
      if (!prefs.time24){ ap = h < 12 ? ' AM' : ' PM'; h = h % 12 || 12; }
      var out = (prefs.time24 ? pad(h) : h) + ':' + pad(d.getMinutes());
      if (prefs.seconds) out += ':' + pad(d.getSeconds());
      return out + ap;
    }
    function fmtDate(d){
      if (prefs.dateFmt === 'hidden') return '';
      var wS = WD[d.getDay()].slice(0,3), wL = WD[d.getDay()];
      var mS = MO[d.getMonth()].slice(0,3), mL = MO[d.getMonth()];
      var day = d.getDate(), yr = d.getFullYear();
      switch (prefs.dateFmt){
        case 'medium':  return wS+' '+day+' '+mS+' '+yr;
        case 'long':    return wL+' '+day+' '+mL+' '+yr;
        case 'ordinal': return wL+' '+ord(day)+' '+mL+' '+yr;
        case 'numeric': return pad(day)+'/'+pad(d.getMonth()+1)+'/'+yr;
        default:        return wS+' '+day+' '+mS; // short
      }
    }
    function render(){
      var d = new Date();
      timeEl.textContent = fmtTime(d);
      var ds = fmtDate(d);
      dateEl.textContent = ds;
      dateEl.hidden = !ds;
    }

    // Settings controls: two toggle buttons + a date-format slider, styled like
    // the page's other pills (no native select/checkbox). syncControls reflects
    // current prefs back onto the controls; clicks/slides write prefs live.
    var toggles = document.querySelectorAll('[data-clk-toggle]');
    var range   = document.querySelector('[data-clk-range="dateFmt"]');
    var preview = document.querySelector('[data-clk-preview]');

    function syncControls(){
      toggles.forEach(function(btn){
        var key = btn.getAttribute('data-clk-toggle');
        btn.classList.toggle('is-on', !!prefs[key]);
        btn.setAttribute('aria-pressed', prefs[key] ? 'true' : 'false');
        if (key === 'time24') btn.textContent = prefs.time24 ? '24-hour' : 'AM / PM';
      });
      if (range){
        var i = FMTS.indexOf(prefs.dateFmt); if (i < 0) i = FMTS.indexOf('medium');
        range.value = i;
      }
      if (preview) preview.textContent = prefs.dateFmt === 'hidden' ? 'No date' : fmtDate(new Date());
    }

    toggles.forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-clk-toggle');
        prefs[key] = !prefs[key]; set(key, prefs[key]);
        syncControls(); render();
      });
    });
    if (range){
      range.addEventListener('input', function(){
        prefs.dateFmt = FMTS[parseInt(range.value, 10)] || 'medium';
        set('dateFmt', prefs.dateFmt);
        syncControls(); render();
      });
    }

    syncControls();
    render();
    setInterval(render, 1000);
  })();
  </script>
  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
