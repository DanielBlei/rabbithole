{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{.Title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <span class="wordmark"><b>The Rabbit Hole</b></span>
      <span class="breaker">/</span>
      <nav class="topbar__nav">
        <a class="{{if eq .Active "feed"}}active{{end}}" href="/feed">Feed</a>
      </nav>
    </div>
    <div class="topbar__right">
      <button class="settings-btn" id="settingsToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
        <span class="gear">&#9881;</span>
      </button>
      <div class="settings-panel" id="settingsPanel" hidden>
        <a class="settings-panel__item" href="#" hx-get="/config" hx-target="#modal" hx-swap="innerHTML">View config</a>
      </div>
    </div>
  </header>
  <div class="content">
    {{block "content" .}}{{end}}
  </div>
  <div id="modal"></div>
  <script>
  (function(){
    var btn = document.getElementById('settingsToggle');
    var panel = document.getElementById('settingsPanel');

    function close(){
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }
    function open(){
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
    }

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      if (panel.hidden) { open(); } else { close(); }
    });
    document.addEventListener('click', function(e){
      if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) close();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape') close();
    });
  })();

  // Config viewer modal: htmx swaps the fragment into #modal; this clears it on
  // backdrop click, the close button, or Escape. The "View config" link also
  // closes the settings dropdown so the modal isn't left under it.
  (function(){
    var modal = document.getElementById('modal');
    function dismiss(){ modal.innerHTML = ''; }
    modal.addEventListener('click', function(e){
      if (e.target.closest('[data-modal-close]')) dismiss();
    });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && modal.firstElementChild) dismiss();
    });
  })();
  </script>
  {{block "scripts" .}}{{end}}
</body>
</html>
{{end}}
