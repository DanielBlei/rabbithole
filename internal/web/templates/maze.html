{{define "content"}}
<!-- data-wx-mode (subbar|inline|rail-right|rail-left|off) is set by static/js/
     weather.js from the weather.mode localStorage pref; the CSS shows the one
     matching weather container and lays out the rail column. -->
<div class="maze" data-wx-mode="subbar">
  <!-- Top-level board switch: Todos | Ideas. The radios live here (outside the
       grid + widget fragments) so the active board survives an htmx widget swap. -->
  <input type="radio" name="mazeTab" id="mazeTabTodos" class="maze-tab-radio" checked>
  <input type="radio" name="mazeTab" id="mazeTabIdeas" class="maze-tab-radio">

  <!-- .maze-grid becomes a two-column grid in the rail modes (rail beside the
       boards); a plain block otherwise. All weather containers are populated by
       static/js/weather.js and stay empty/hidden on the Feed page. -->
  <div class="maze-grid">
    <!-- Right/left rail: full weather column. Shown only in rail-* modes. -->
    <aside class="maze-rail" id="wxRail"></aside>

    <div class="maze-main">
      <!-- Flat sub-bar under the topbar. Shown only in subbar mode. -->
      <div class="wx-subbar" id="wxSubbar"></div>

      <div class="maze-tabline">
        <div class="maze-tabs" role="tablist" aria-label="Maze boards">
          <label class="maze-tab" for="mazeTabTodos">Tasks</label>
          <label class="maze-tab" for="mazeTabIdeas">Ideas</label>
        </div>
        <!-- Condensed chip in the tab-row gutter. Shown only in inline mode. -->
        <span class="wx-chip" id="wxChip"></span>
      </div>
      <div class="maze-panel maze-panel--todos">{{template "todoWidget" .}}</div>
      <div class="maze-panel maze-panel--ideas">{{template "ideaWidget" .}}</div>
    </div>
  </div>
</div>
{{end}}

{{/* tagput.js is in the layout now — Sources needs it on every page, and loading
     it here as well would run its IIFE twice. */}}
{{define "scripts"}}
<script src="/static/js/maze.js" defer></script>
{{end}}
