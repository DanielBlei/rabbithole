{{define "content"}}
<div class="maze">
  <!-- Top-level board switch: Todos | Ideas. The radios live here (outside both
       widget fragments) so the active board survives an htmx widget swap. -->
  <input type="radio" name="mazeTab" id="mazeTabTodos" class="maze-tab-radio" checked>
  <input type="radio" name="mazeTab" id="mazeTabIdeas" class="maze-tab-radio">
  <div class="maze-tabs" role="tablist" aria-label="Maze boards">
    <label class="maze-tab" for="mazeTabTodos">Tasks</label>
    <label class="maze-tab" for="mazeTabIdeas">Ideas</label>
  </div>
  <div class="maze-panel maze-panel--todos">{{template "todoWidget" .}}</div>
  <div class="maze-panel maze-panel--ideas">{{template "ideaWidget" .}}</div>
</div>
{{end}}

{{define "scripts"}}
<script>
(function () {
  // The todo widget re-renders whole on every mutation, so init runs again on
  // each htmx swap; the tag filter's selection is kept in a closure Set so it
  // survives those swaps. All state lives in the DOM otherwise (no framework).

  // ---- tag-chip input -------------------------------------------------
  function universe() {
    var w = document.getElementById('todoWidget');
    var raw = (w && w.dataset.allTags) || '';
    return raw ? raw.split(',') : [];
  }
  function parseList(v) {
    return (v || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // ---- tag colours (theme palette, deterministic + click-to-recolour) --
  // Each tag name maps to one of TAG_COLORS palette classes (.tag--cN in the
  // CSS). Default is a stable hash of the name; a click on a row chip cycles it
  // and the choice persists in localStorage, so a tag stays the same colour
  // everywhere it appears.
  var TAG_COLORS = 8;
  function colorStore() { try { return JSON.parse(localStorage.getItem('rh.tagColors') || '{}'); } catch (e) { return {}; } }
  function saveColorStore(m) { try { localStorage.setItem('rh.tagColors', JSON.stringify(m)); } catch (e) {} }
  function tagHash(name) {
    var h = 5381; name = name.toLowerCase();
    for (var i = 0; i < name.length; i++) { h = ((h << 5) + h + name.charCodeAt(i)) >>> 0; }
    return h;
  }
  function colorIndex(name) {
    var m = colorStore(), k = name.toLowerCase();
    return (k in m ? m[k] : tagHash(name)) % TAG_COLORS;
  }
  function colorize(el, name) {
    for (var i = 0; i < TAG_COLORS; i++) { el.classList.remove('tag--c' + i); }
    el.classList.add('tag--c' + colorIndex(name));
  }
  function applyTagColors() {
    document.querySelectorAll('#todoWidget .todo__tag').forEach(function (el) {
      colorize(el, (el.dataset.tag || el.textContent).trim());
    });
    document.querySelectorAll('.pill--tag').forEach(function (el) {
      var s = el.querySelector('span'); colorize(el, (s ? s.textContent : '').trim());
    });
    document.querySelectorAll('.tagput__chip, .tagput__sug').forEach(function (el) {
      if (el.dataset.tag) { colorize(el, el.dataset.tag); }
    });
  }
  // Click a row tag chip to advance its colour (persists for that tag name).
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('.todo__tag');
    if (!el) return;
    var name = (el.dataset.tag || el.textContent).trim(), k = name.toLowerCase();
    var m = colorStore();
    m[k] = ((k in m ? m[k] : tagHash(name)) + 1) % TAG_COLORS;
    saveColorStore(m);
    applyTagColors();
  });
  function tpHidden(tp) { return tp.querySelector('input[type=hidden]'); }
  function tpTags(tp) { return parseList(tpHidden(tp).value); }

  function tpSet(tp, tags) {
    var seen = {}, out = [];
    tags.forEach(function (t) {
      t = t.replace(/,/g, '').trim();
      var k = t.toLowerCase();
      if (t && !seen[k]) { seen[k] = 1; out.push(t); }
    });
    tpHidden(tp).value = out.join(',');
    tpRender(tp);
  }
  function tpAdd(tp, text) {
    if (text && text.trim()) { tpSet(tp, tpTags(tp).concat(text.split(','))); }
  }
  function tpRender(tp) {
    var chips = tp.querySelector('.tagput__chips');
    chips.innerHTML = '';
    tpTags(tp).forEach(function (t) {
      var chip = document.createElement('span');
      chip.className = 'tagput__chip';
      chip.dataset.tag = t;
      chip.textContent = t;
      colorize(chip, t);
      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'tagput__x';
      x.setAttribute('aria-label', 'Remove tag ' + t);
      x.innerHTML = '&times;';
      x.addEventListener('click', function () {
        tpSet(tp, tpTags(tp).filter(function (o) { return o !== t; }));
      });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
  }
  function tpSuggest(tp) {
    var input = tp.querySelector('.tagput__input');
    var box = tp.querySelector('.tagput__suggest');
    var q = input.value.trim().toLowerCase();
    var have = {};
    tpTags(tp).forEach(function (t) { have[t.toLowerCase()] = 1; });
    var matches = universe().filter(function (t) {
      return !have[t.toLowerCase()] && t.toLowerCase().indexOf(q) !== -1;
    });
    box.innerHTML = '';
    if (!matches.length) { box.hidden = true; return; }
    // Anchor the popover under the text input (the last item), not the box's
    // left edge, so it drops from where you're actually typing.
    box.style.left = input.offsetLeft + 'px';
    matches.slice(0, 8).forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tagput__sug';
      b.dataset.tag = t;
      b.textContent = t;
      colorize(b, t);
      b.addEventListener('mousedown', function (e) {
        e.preventDefault();
        tpAdd(tp, t); input.value = ''; tpSuggest(tp); input.focus();
      });
      box.appendChild(b);
    });
    box.hidden = false;
  }
  function initTagput(tp) {
    if (tp.dataset.ready) return;
    tp.dataset.ready = '1';
    var input = tp.querySelector('.tagput__input');
    tpRender(tp);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault(); tpAdd(tp, input.value); input.value = ''; tpSuggest(tp);
      } else if (e.key === 'Backspace' && !input.value) {
        var tags = tpTags(tp);
        if (tags.length) { tpSet(tp, tags.slice(0, -1)); }
      }
    });
    input.addEventListener('input', function () { tpSuggest(tp); });
    input.addEventListener('focus', function () { tpSuggest(tp); });
    input.addEventListener('blur', function () {
      tpAdd(tp, input.value); input.value = '';
      setTimeout(function () { tp.querySelector('.tagput__suggest').hidden = true; }, 120);
    });
  }
  // Panels show via CSS :checked; radios can't uncheck themselves, so this only
  // handles the collapse-on-re-click case. State is stashed on the tab element
  // between its own mousedown and click (same element, so it survives). Same
  // handler the Feed's why/note tabs use.
  document.addEventListener('mousedown', function (e) {
    var tab = e.target.closest('.tg-tab');
    if (!tab) return;
    var input = document.getElementById(tab.getAttribute('for'));
    tab._open = !!(input && input.checked);
  });
  document.addEventListener('click', function (e) {
    var tab = e.target.closest('.tg-tab');
    if (!tab || !tab._open) return;
    var input = document.getElementById(tab.getAttribute('for'));
    if (input) { e.preventDefault(); input.checked = false; }
  });

  // Commit any pending typed text before an hx-post form submits.
  document.addEventListener('submit', function (e) {
    var tp = e.target.querySelector && e.target.querySelector('[data-tagput]');
    if (tp) { var input = tp.querySelector('.tagput__input'); tpAdd(tp, input.value); input.value = ''; }
  }, true);

  // ---- idea note: live colour preview ---------------------------------
  // Picking a swatch recolours its note immediately (the .note--<colour> class is
  // the single source of the card's look), so editing feels fluid; the server
  // records the choice on save. Delegated so it works on swapped-in notes too.
  document.addEventListener('change', function (e) {
    var inp = e.target;
    if (!inp.matches || !inp.matches('.idea__palette input[name=color]')) return;
    var note = inp.closest('.note');
    if (!note) return;
    Array.prototype.slice.call(note.classList).forEach(function (c) {
      if (c.indexOf('note--') === 0 && c !== 'note--new' && c !== 'note--dragging') note.classList.remove(c);
    });
    note.classList.add('note--' + inp.value);
  });

  // ---- swap boards by scrolling the empty frame ------------------------
  // Wheeling anywhere on the Maze page that ISN'T a board pane or the topbar —
  // the tab row, the page margins, the area below the panes — flips between Tasks
  // and Ideas by scroll direction (down → Ideas, up → Tasks), with a short cooldown
  // so one gesture is one swap. Scrolling over a board pane is left untouched.
  var lastSwap = 0;
  document.addEventListener('wheel', function (e) {
    if (!document.querySelector('.maze') || (e.target.closest && (e.target.closest('.pane') || e.target.closest('.topbar')))) return;
    var now = Date.now();
    if (now - lastSwap < 450) { e.preventDefault(); return; }
    var todos = document.getElementById('mazeTabTodos');
    var ideas = document.getElementById('mazeTabIdeas');
    if (!todos || !ideas) return;
    var changed = false;
    if (e.deltaY > 0 && !ideas.checked) { ideas.checked = true; changed = true; }
    else if (e.deltaY < 0 && !todos.checked) { todos.checked = true; changed = true; }
    if (changed) { lastSwap = now; e.preventDefault(); }
  }, { passive: false });

  // ---- tag filter (client-side OR, across all tab panels) -------------
  var selected = new Set();
  function applyFilter() {
    document.querySelectorAll('#todoWidget .todo').forEach(function (row) {
      if (!selected.size) { row.classList.remove('todo--filtered'); return; }
      var tags = (row.dataset.tags || '').split(',').filter(Boolean);
      var hit = tags.some(function (t) { return selected.has(t); });
      row.classList.toggle('todo--filtered', !hit);
    });
    var dot = document.querySelector('[data-tag-active]');
    if (dot) dot.hidden = selected.size === 0;
  }
  function initFilter() {
    var boxes = document.querySelectorAll('.todo-filter__chk');
    var exists = new Set();
    boxes.forEach(function (b) { exists.add(b.value.toLowerCase()); });
    Array.from(selected).forEach(function (t) { if (!exists.has(t)) selected.delete(t); });
    boxes.forEach(function (b) {
      var v = b.value.toLowerCase();
      b.checked = selected.has(v);
      b.addEventListener('change', function () {
        if (b.checked) selected.add(v); else selected.delete(v);
        applyFilter();
      });
    });
    applyFilter();
  }

  // ---- idea board: native drag-to-reorder -----------------------------
  // The whole note is draggable; while a note is in edit mode (its checkbox is
  // checked) dragging is suppressed so the textarea stays usable. On drop the new
  // left-to-right order is POSTed to /ideas/reorder — the DOM is already in that
  // order, so no swap-back is needed. Re-binds when the widget re-renders (guarded
  // by board.dataset.dragReady so a todo-side swap doesn't double-bind).
  function afterElement(board, x, y) {
    var els = Array.prototype.slice.call(board.querySelectorAll('.note[draggable=true]:not(.note--dragging)'));
    for (var i = 0; i < els.length; i++) {
      var b = els[i].getBoundingClientRect();
      if (y < b.top) return els[i];                       // pointer is above this row
      if (y <= b.bottom && x < b.left + b.width / 2) return els[i]; // same row, left of centre
    }
    return null;                                          // past everything → append
  }
  function persistOrder(board) {
    var ids = Array.prototype.slice.call(board.querySelectorAll('.note[draggable=true]'))
      .map(function (n) { return n.dataset.id; }).filter(Boolean);
    if (!ids.length) return;
    fetch('/ideas/reorder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'ids=' + encodeURIComponent(ids.join(','))
    });
  }
  function initIdeas() {
    var board = document.querySelector('#ideaWidget .ideaboard');
    if (!board || board.dataset.dragReady) return;
    board.dataset.dragReady = '1';
    var dragEl = null;
    board.addEventListener('dragstart', function (e) {
      var n = e.target.closest && e.target.closest('.note[draggable=true]');
      if (!n) return;
      var chk = n.querySelector('.idea__edit-chk');
      if (chk && chk.checked) { e.preventDefault(); return; } // don't drag while editing
      dragEl = n;
      setTimeout(function () { n.classList.add('note--dragging'); }, 0);
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', n.dataset.id || ''); } catch (_) {}
      }
    });
    board.addEventListener('dragover', function (e) {
      if (!dragEl) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      var before = afterElement(board, e.clientX, e.clientY);
      if (before) board.insertBefore(dragEl, before);
      else board.appendChild(dragEl);
    });
    board.addEventListener('dragend', function () {
      if (!dragEl) return;
      dragEl.classList.remove('note--dragging');
      dragEl = null;
      persistOrder(board);
    });
  }

  function initMaze() {
    document.querySelectorAll('[data-tagput]').forEach(initTagput);
    initFilter();
    applyTagColors();
    initIdeas();
  }
  document.addEventListener('DOMContentLoaded', initMaze);
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (document.getElementById('todoWidget')) initMaze();
  });
})();
</script>
{{end}}
