# The Rabbit Hole configuration. Copy to configs/config.yaml and edit.
# Every field and its default: docs/configuration.md

# user: rabbit                  # web UI shell prompt customization; unset uses your OS login name

inference:
  provider: ollama              # ollama | vllm | heuristic (keywords, no model)
  host: http://localhost:11434
  model: qwen3.5:4b             # gemma4:26b | qwen3.6:35b | etc
  think: false                  # model reasoning before scoring; default true
  # api_key: ""                 # bearer token, if your endpoint needs one

  # system_prompt: ./configs/prompts/system.example.md   # model instructions; omit to use the built-in default
  # system_prompt: false                                 # send no system message (e.g. an Ollama Modelfile already sets one)

  batch_size: 1                 # articles per scoring request (lower helps smaller models focus)
  max_parallel: 1               # requests in flight; keep at 1 for Ollama, it queues anyway

  # Decoding limits. Token budgets and the length of the "why" can be tuned too;
  # see docs/configuration.md#inferencemodel_tuning.
  model_tuning:
    num_ctx: 8192               # input window; unset lets Ollama silently truncate long prompts

ingest:
  # Optional seed file, read at startup to bulk-add sources.
  # Sources can also be added and managed from the Sources page.
  feeds: ./configs/feeds.example.yaml

store:
  db_path: ./data/rabbithole.db   # sqlite, the local default

  # Postgres instead, to reach one store from more than one machine. Set either
  # db_path or url, never both; the password comes from RABBITHOLE_DB_PASSWORD (.env).
  # url: postgres://rabbithole@db.example.com:5432/rabbithole
  #
  # The same, also verifying the server rather than only encrypting to it:
  # url: postgres://rabbit@db.example.com:5432/rabbithole?sslmode=verify-full&sslrootcert=/etc/ssl/ca.pem
