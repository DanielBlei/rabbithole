# ai-searcher configuration. Copy to configs/config.yaml and edit.

# Name shown in the web UI's shell prompt (e.g. "daniel@ai-searcher:~$").
# Leave blank/omit to fall back to your OS login name.
user: danielblei

# Path to your interest profile (free-form markdown). This is injected into the
# scoring prompt and is the main personalization knob.
profile: ./configs/profile.example.md

# Inference backend: the model and how to reach it.
#   provider: ollama | vllm | heuristic
#     ollama    - local Ollama server (default)
#     vllm      - any OpenAI-compatible endpoint (vLLM, etc.)
#     heuristic - keyword overlap, no model (offline testing)
inference:
  provider: ollama
  host: http://localhost:11434
  model: gemma3:1b # qwen3:1.7b # qwen3:0.6b
  api_key: "" # optional bearer token (vLLM prod / Ollama cloud)
  think: false # model reasoning during scoring; omit to default on. gemma3:1b has no thinking mode, so disabled here

# How items are batched through the scorer.
scoring:
  batch_size: 5   # items sent per scoring request
  max_parallel: 1 # concurrent scoring requests in flight

# Fetch/score run settings.
ingest:
  since: 7d  # ignore items older than this; accepts 'd' (days) or 'h' (e.g. 14d, 168h)
  # digest_dir: ./data/digests  # set only to export a markdown digest via `ingest --markdown`

# Item persistence.
store:
  db_path: ./data/ai-searcher.db

# Feeds (any RSS/Atom URL). Medium tag/author/publication feeds:
#   https://medium.com/feed/tag/<tag>
#   https://medium.com/feed/@<username>
#   https://medium.com/feed/<publication>
feeds:
  - { name: "Medium — AI",          url: "https://medium.com/feed/tag/artificial-intelligence" }
  - { name: "Medium — LLMs",        url: "https://medium.com/feed/tag/large-language-models" }
  - { name: "Medium — ML",          url: "https://medium.com/feed/tag/machine-learning" }
#  - { name: "arXiv cs.AI",          url: "http://export.arxiv.org/rss/cs.AI" }
#  - { name: "arXiv cs.LG",          url: "http://export.arxiv.org/rss/cs.LG" }
  - { name: "Hugging Face blog",    url: "https://huggingface.co/blog/feed.xml" }
  - { name: "Red Hat Emerging Tech", url: "https://next.redhat.com/feed/" }
