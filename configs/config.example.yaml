# The Rabbit Hole configuration. Copy to configs/config.yaml and edit.

# Name shown in the web UI's shell prompt (e.g. "daniel@rabbithole:~$").
# Leave blank/omit to fall back to your OS login name.
user: danielblei

# Path to your interest profile (free-form markdown). This is injected into the
# scoring prompt and is the main personalization knob.
profile: ./configs/profile.example.md

# Inference backend: the model, how to reach it, and how items are fed to it.
inference:
  provider: ollama # Ollama | vLLM | heuristic - keywords (offline testing)
  host: http://localhost:11434
  model: gemma3:1b # phi3:3.8b | qwen3:4b | etc
  think: false # model reasoning during scoring; omit to default on. gemma3:1b has no thinking mode, so disabled here
  # api_key: "" # optional bearer token for model connection

  batch_size: 5 # items per scoring request (default 5)
  max_parallel: 1 # concurrent scoring requests (default 2). Ollama queues rather than parallelizes, so keep it at 1 here

  # Decoding limits, per model. Omit the block or any field to take the defaults below.
  # Worth tuning to sharpen scoring as model behavior varies.
  model_tuning:
    num_ctx: 8192          # input window. Unset, Ollama silently truncates a long prompt. Ollama only, vLLM uses --max-model-len at startup
    max_tokens: 0          # tokens for the whole reply; 0 auto-sizes from the three below
    tokens_per_item: 256   # allowance per article in a batch
    tokens_overhead: 256   # allowance for the JSON scaffolding
    tokens_thinking: 2048  # added when think is on; reasoning spends the same budget
    reason_max_chars: 200  # max characters for the reason in the model's schema-enforced JSON response.

# Fetch/score run settings.
ingest:
  # Global lookback window — the outermost fallback for a feed's `since`.
  # Accepts 'd' (days) or 'h' (e.g. 14d, 168h).
  since: 7d

  # The feed list (see configs/feeds.example.yaml).
  feeds: ./configs/feeds.example.yaml

# Item persistence (SQLite).
store:
  db_path: ./data/rabbithole.db
