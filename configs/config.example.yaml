# The Rabbit Hole configuration. Copy to configs/config.yaml and edit.
# Every field and its default: docs/configuration.md

# user:                                 # web UI shell prompt; unset uses your OS login name
profile: ./configs/profile.example.md   # what you're interested in, driving the ranking

inference:
  provider: ollama              # ollama | vllm | heuristic (keywords, no model)
  host: http://localhost:11434
  model: qwen3:4b               # gemma3:4b | phi3:3.8b | etc
  think: false                  # model reasoning before scoring; default true
  # api_key: ""                 # bearer token, if your endpoint needs one

  batch_size: 5                 # articles per scoring request
  max_parallel: 1               # requests in flight; keep at 1 for Ollama, it queues anyway

  # Decoding limits. Omit the block, or any field, to take the defaults below.
  model_tuning:
    num_ctx: 8192               # input window; unset lets Ollama silently truncate long prompts
    max_tokens: 0               # whole reply; 0 sizes it from the three below
    tokens_per_item: 256        # per article in a batch
    tokens_overhead: 256        # for the JSON wrapper
    tokens_thinking: 2048       # added when think is on
    reason_max_chars: 200       # longest "why" the model may write per item

ingest:
  since: 7d                             # how far back to look; accepts d/h/m (7d, 168h, 90m)
  feeds: ./configs/feeds.example.yaml   # RSS feeds to pull from
  digest_dir: ./data/digests            # where `ingest --markdown` writes; required by that flag

store:
  db_path: ./data/rabbithole.db
