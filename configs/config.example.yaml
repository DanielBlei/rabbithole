# The Rabbit Hole configuration. Copy to configs/config.yaml and edit.
# Every field and its default: docs/configuration.md

# user:                                         # web UI shell prompt; unset uses your OS login name
profile: ./configs/prompts/profile.example.md   # what you're interested in, driving the ranking

inference:
  provider: ollama              # ollama | vllm | heuristic (keywords, no model)
  host: http://localhost:11434
  model: qwen3.5:4b             # gemma4:26b | qwen3.6:35b | etc
  think: false                  # model reasoning before scoring; default true
  # api_key: ""                 # bearer token, if your endpoint needs one

  # system_prompt: ./configs/prompts/system.example.md   # model instructions; omit to use the built-in default
  # system_prompt: false                                 # send no system message (e.g. an Ollama Modelfile already sets one)

  batch_size: 1                 # articles per scoring request (lower helps smaller models focus)
  max_parallel: 1               # requests in flight; keep at 1 for Ollama, it queues anyway

  # Decoding limits. Omit the block, or any field, to take the defaults below.
  model_tuning:
    num_ctx: 8192               # input window; unset lets Ollama silently truncate long prompts
    max_tokens: 0               # whole reply; 0 sizes it from the three below
    tokens_per_item: 1024       # per article in a batch
    tokens_overhead: 512        # threshold for the JSON score response
    tokens_thinking: 2048       # thinking allowance when think is on
    reason_max_chars: 512       # threshold for the "why" behind a model's score

ingest:
  since: 7d                             # how far back to look; accepts d/h/m (7d, 168h, 90m)
  feeds: ./configs/feeds.example.yaml   # RSS feeds to pull from
  digest_dir: ./data/digests            # output for markdown report, `ingest` CLI usage only

store:
  db_path: ./data/rabbithole.db
