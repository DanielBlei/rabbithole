# The Rabbit Hole feed list. Copy to configs/feeds.yaml and edit.
# Inheritance, feed identity, health: docs/configuration.md

# Applied to any feed that doesn't set the knob itself.
defaults:
  since: 7d       # ignore items older than this; accepts d/h/m (7d, 168h, 90m)
  max_items: 25   # cap for the number of items per feed, some may return hundreds; omit to remove cap

feeds:
  # Minimum: a unique name and a URL. The rest falls through to defaults.
  - name: Red Hat Emerging Tech
    url: https://next.redhat.com/feed/
    tags:
      - Red Hat
      - Infra

  - name: Hugging Face blog
    url: https://huggingface.co/blog/feed.xml
    tags:
      - AI
      - Research

  - name: arXiv — cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    tags:
      - AI
      - Research
      - Papers

  - name: Medium — AI
    url: https://medium.com/feed/tag/artificial-intelligence
    since: 2d     # override the default window for one feed
    max_items: 10 # High volume: retrieve only small number of items
    tags:
      - AI
      - Medium

  - name: Medium — LLMs
    url: https://medium.com/feed/tag/large-language-models
    max_items: 10 # High volume: retrieve only small number of items
    tags:
      - AI
      - Medium

  # Parked: kept here with its history, never fetched. Flip to true to resume.
  - name: Medium — ML
    url: https://medium.com/feed/tag/machine-learning
    enabled: false
    tags:
      - AI
      - Medium

# A feed is identified by its URL — renaming keeps its history, changing the URL
# starts a new feed. Names must be unique; items are filed under the name.
#
# Medium URL shapes:
#   https://medium.com/feed/tag/<tag>
#   https://medium.com/feed/@<username>
